<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>neinainoi</title>
<meta name="description" content="wearable architecture you build yourself.">
<meta name="theme-color" content="#0B0A0C">
<meta property="og:title" content="neinainoi">
<meta property="og:description" content="wearable architecture you build yourself.">
<meta property="og:image" content="https://neinainoi.com/media/series-001-poster.jpg">
<meta property="og:url" content="https://neinainoi.com/">
<link rel="preload" href="/fonts/SofiaSansExtraCondensed-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main>
  <h1 class="mark">nei<span class="nai">nai</span>noi</h1>

  <video class="film" autoplay muted loop playsinline preload="auto"
    poster="/media/series-001-poster.jpg" width="1080" height="1920"
    aria-label="two people stand at a railing on a wooden walkway, each wearing a neinainoi look, while others walk past.">
    <source src="/media/series-001-720.webm" type="video/webm" media="(max-width: 899px)">
    <source src="/media/series-001-720.mp4" type="video/mp4" media="(max-width: 899px)">
    <source src="/media/series-001-1080.webm" type="video/webm">
    <source src="/media/series-001-1080.mp4" type="video/mp4">
  </video>

  <div class="end">
    <p class="line">wearable architecture you build yourself.</p>
    <p class="soon">coming soon.</p>

    <form class="signup" action="https://buttondown.com/api/emails/embed-subscribe/BUTTONDOWN_USERNAME"
      method="post" target="signup-sink">
      <label class="hide" for="email">email</label>
      <input id="email" type="email" name="email" placeholder="email" autocomplete="email" required>
      <input type="hidden" name="embed" value="1">
      <button type="submit">sign up</button>
    </form>
    <p class="done" role="status" hidden>thank you. check your inbox.</p>
    <a class="privacy" href="/privacy.html">privacy</a>
  </div>
</main>
<iframe name="signup-sink" title="signup" hidden></iframe>
<script>
  // Without this script the form posts normally and Buttondown shows its own page.
  const f = document.querySelector('.signup');
  f.addEventListener('submit', () => {
    setTimeout(() => { f.hidden = true; document.querySelector('.done').hidden = false; }, 300);
  });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const v = document.querySelector('.film'); v.removeAttribute('autoplay'); v.pause(); v.controls = true;
  }
</script>
</body>
</html>
