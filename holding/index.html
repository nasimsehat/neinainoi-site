<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>neinainoi</title>
<meta name="description" content="wearable architecture you build yourself.">
<meta name="theme-color" content="#0B0A0C">
<meta property="og:title" content="neinainoi">
<meta property="og:description" content="wearable architecture you build yourself.">
<meta property="og:image" content="https://neinainoi.com/media/series-001-poster.jpg">
<meta property="og:url" content="https://neinainoi.com/">
<link rel="preload" href="/fonts/SofiaSansExtraCondensed-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main>
  <h1 class="mark">nei<span class="nai">nai</span>noi</h1>

  <video class="film" autoplay muted loop playsinline preload="auto"
    poster="/media/series-001-poster.jpg" width="588" height="1046"
    aria-label="black and white film. two people stand at a railing, each wearing a neinainoi look, while others walk past.">
    <source src="/media/series-001.mp4" type="video/mp4">
    <source src="/media/series-001.webm" type="video/webm">
  </video>

  <div class="end">
    <p class="line">wearable architecture you build yourself.</p>
    <p class="soon">coming soon.</p>

    <form class="signup" action="/api/subscribe" method="post">
      <label class="hide" for="email">email</label>
      <input id="email" type="email" name="email" placeholder="email" autocomplete="email" required>
      <input class="hide" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">sign up</button>
    </form>
    <p class="done" role="status" hidden>thank you. check your inbox.</p>
    <a class="privacy" href="/privacy.html">privacy</a>
  </div>
</main>
<script>
  // Without this script the form posts normally and the visitor lands on /thanks.html.
  const f = document.querySelector('.signup');
  const done = document.querySelector('.done');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch(f.action, { method: 'POST', body: new FormData(f), headers: { accept: 'application/json' } }).catch(() => null);
    if (res && res.ok) { f.hidden = true; done.textContent = 'thank you. check your inbox.'; }
    else { done.textContent = 'that did not work. try again.'; }
    done.hidden = false;
  });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const v = document.querySelector('.film'); v.removeAttribute('autoplay'); v.pause(); v.controls = true;
  }
</script>
</body>
</html>
